name: Tests and deployment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Run backend unittest suite
        run: python -m unittest test_server.py -v
      - name: Validate Python entrypoints
        run: python -m py_compile server.py backup.py restore.py test_server.py
      - name: Check browser scripts parse
        run: |
          node --check script.js
          node --check portal.js

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate compose manifest
        run: docker compose -f docker-compose.yml config
