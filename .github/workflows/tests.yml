name: Tests and deployment checks

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend unittest suite
        run: python -m unittest test_server.py -v
      - name: Validate backup client entrypoint
        run: python -m py_compile backup.py server.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose manifest
        run: docker compose -f docker-compose.yml config
